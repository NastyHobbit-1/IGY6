services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - type: bind
        source: ${IGY6_DATA_ROOT}/postgres
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - type: bind
        source: ${IGY6_DATA_ROOT}/qdrant
        target: /qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_server_default__listen__address: 0.0.0.0
      NEO4J_server_bolt_listen__address: 0.0.0.0:7687
      NEO4J_server_http_listen__address: 0.0.0.0:7474
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - type: bind
        source: ${IGY6_DATA_ROOT}/neo4j/data
        target: /data
      - type: bind
        source: ${IGY6_DATA_ROOT}/neo4j/logs
        target: /logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.20.3
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --default-artifact-root
      - /mlflow/artifacts
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - type: bind
        source: ${IGY6_DATA_ROOT}/mlflow
        target: /mlflow
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 20

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "127.0.0.1:${PHOENIX_PORT:-6006}:6006"
    volumes:
      - type: bind
        source: ${IGY6_DATA_ROOT}/phoenix
        target: /mnt/data
    healthcheck:
      test: ["CMD", "/usr/bin/python3.13", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20

  legacy-api:
    build:
      context: ../services/api
    environment:
      APP_ENV: ${APP_ENV}
      APP_HOST: ${APP_HOST}
      APP_PORT: ${APP_PORT}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      QDRANT_URL: ${QDRANT_URL}
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
      PHOENIX_COLLECTOR_ENDPOINT: ${PHOENIX_COLLECTOR_ENDPOINT}
      ARTIFACT_STORE_PATH: ${ARTIFACT_STORE_PATH}
      EXPORT_STORE_PATH: ${EXPORT_STORE_PATH}
      ENV_FILE_PATH: ${ENV_FILE_PATH:-/workspace/project/.env}
      ENV_BACKUP_DIR: ${ENV_BACKUP_DIR:-/workspace/storage/env_backups}
      IGY6_DATA_ROOT: ${IGY6_DATA_ROOT}
      EXTERNAL_MODEL_POLICY_DEFAULT: ${EXTERNAL_MODEL_POLICY_DEFAULT}
      SINGLE_USER_MODE: ${SINGLE_USER_MODE}
      AUDIT_LOG_LEVEL: ${AUDIT_LOG_LEVEL}
      APPROVAL_REQUIRED_DEFAULT: ${APPROVAL_REQUIRED_DEFAULT}
    volumes:
      - type: bind
        source: ${IGY6_DATA_ROOT}
        target: /workspace/storage
      - type: bind
        source: ..
        target: /workspace/project
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      neo4j:
        condition: service_started
      mlflow:
        condition: service_started
      phoenix:
        condition: service_started

  api:
    build:
      context: ..
      dockerfile: crates/igy6-gateway/Dockerfile
    environment:
      GATEWAY_BIND_ADDR: 0.0.0.0:8000
      FALLBACK_API_BASE_URL: http://legacy-api:8000
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      legacy-api:
        condition: service_started

  worker:
    build:
      context: ../services/worker
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      DATABASE_URL: ${DATABASE_URL}
      ARTIFACT_STORE_PATH: ${ARTIFACT_STORE_PATH}
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_CHUNK_COLLECTION: ${QDRANT_CHUNK_COLLECTION}
      QDRANT_CHUNK_VECTOR_SIZE: ${QDRANT_CHUNK_VECTOR_SIZE}
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "--loglevel=INFO"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${IGY6_DATA_ROOT}
        target: /workspace/storage

  beat:
    build:
      context: ../services/worker
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      DATABASE_URL: ${DATABASE_URL}
      ARTIFACT_STORE_PATH: ${ARTIFACT_STORE_PATH}
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_CHUNK_COLLECTION: ${QDRANT_CHUNK_COLLECTION}
      QDRANT_CHUNK_VECTOR_SIZE: ${QDRANT_CHUNK_VECTOR_SIZE}
    command: ["celery", "-A", "app.celery_app:celery_app", "beat", "--loglevel=INFO"]
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${IGY6_DATA_ROOT}
        target: /workspace/storage

  web:
    build:
      context: ../apps/web
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
