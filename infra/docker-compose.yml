services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - type: bind
        source: ${IGY6_DATA_ROOT}/postgres
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - type: bind
        source: ${IGY6_DATA_ROOT}/qdrant
        target: /qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_server_default__listen__address: 0.0.0.0
      NEO4J_server_bolt_listen__address: 0.0.0.0:7687
      NEO4J_server_http_listen__address: 0.0.0.0:7474
      NEO4J_server_telemetry_enabled: "false"
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - type: bind
        source: ${IGY6_DATA_ROOT}/neo4j/data
        target: /data
      - type: bind
        source: ${IGY6_DATA_ROOT}/neo4j/logs
        target: /logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.20.3
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --default-artifact-root
      - /mlflow/artifacts
    environment:
      MLFLOW_TELEMETRY_ENABLED: "false"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - type: bind
        source: ${IGY6_DATA_ROOT}/mlflow
        target: /mlflow
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 20

  phoenix:
    image: arizephoenix/phoenix:latest
    environment:
      PHOENIX_TELEMETRY_ENABLED: "false"
    ports:
      - "127.0.0.1:${PHOENIX_PORT:-6006}:6006"
    volumes:
      - type: bind
        source: ${IGY6_DATA_ROOT}/phoenix
        target: /mnt/data
    healthcheck:
      test: ["CMD", "/usr/bin/python3.13", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: crates/igy6-gateway/Dockerfile
    environment:
      GATEWAY_BIND_ADDR: 0.0.0.0:8000
      DATABASE_URL: ${DATABASE_URL}
      ENV_FILE_PATH: ${ENV_FILE_PATH:-/workspace/project/.env}
      ENV_BACKUP_DIR: ${ENV_BACKUP_DIR:-/workspace/storage/env_backups}
      IGY6_DATA_ROOT: ${IGY6_DATA_ROOT}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ${IGY6_DATA_ROOT}
        target: /workspace/storage
      - type: bind
        source: ..
        target: /workspace/project

  worker:
    build:
      context: ..
      dockerfile: crates/igy6-worker/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      IGY6_DATA_ROOT: /workspace/storage
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_CHUNK_COLLECTION: ${QDRANT_CHUNK_COLLECTION}
      QDRANT_CHUNK_VECTOR_SIZE: ${QDRANT_CHUNK_VECTOR_SIZE}
      IGY6_WORKER_SHUTDOWN_FILE: ${IGY6_WORKER_SHUTDOWN_FILE:-worker/control/shutdown}
    command:
      - igy6-worker
      - --daemon
      - --claim-limit
      - ${IGY6_WORKER_CLAIM_LIMIT:-4}
      - --poll-interval-ms
      - ${IGY6_WORKER_POLL_INTERVAL_MS:-1000}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${IGY6_DATA_ROOT}
        target: /workspace/storage

  web:
    build:
      context: ../apps/web
    environment:
      API_BASE_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
